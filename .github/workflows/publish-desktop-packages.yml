name: Publish Linux CLI packages

# Windows/macOS desktop UI packaging lives upstream (.goreleaser_ui.yaml,
# .goreleaser_ui_darwin.yaml, .goreleaser_ui_gtk3.yaml). Since v0.77.1 the UI is a
# Wails v3 + React app whose binary embeds frontend/dist, so it can no longer be
# produced by a plain `go build ./client/ui`. This fork patches management only
# (P1/P2/P3) and upstream now ships zh-CN natively, so we consume upstream
# releases for the desktop UI and publish just the Linux CLI deb here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.74.3-zh.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-desktop-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GORELEASER_VER: v2.16.0

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          git rev-parse --verify "refs/tags/${tag}" >/dev/null
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Expected a semver tag beginning with v, got: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          package_version="${version%%-*}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

  build_linux_deb:
    name: Build Linux deb packages
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build deb package
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --clean --config .goreleaser_desktop_linux.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Select requested architecture packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for arch in amd64 arm64; do
            mapfile -t packages < <(find dist -type f -name "*_${arch}.deb" | sort)
            [[ ${#packages[@]} -eq 1 ]] || {
              printf 'Expected one %s deb, found:\n%s\n' "$arch" "${packages[*]:-none}" >&2
              exit 1
            }
            cp "${packages[0]}" "out/netbird_${{ needs.prepare.outputs.version }}_linux_${arch}.deb"
          done

      - name: Upload Linux deb packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: out/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build_linux_deb]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release -maxdepth 1 -type f -name '*.deb' | sort)
          [[ ${#assets[@]} -eq 2 ]] || {
            printf 'Expected exactly two Linux deb assets, found:\n%s\n' "${assets[*]:-none}" >&2
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          args=(--title "NetBird $TAG" --notes "Automated Linux CLI package release for $TAG.")
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" "${assets[@]}" "${args[@]}"
